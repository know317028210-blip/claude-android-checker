<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fdfcfa">
<title>环境检测</title>
<style>
:root{
  --bg:#fdfcfa; --card:#fff; --line:#eeeae4; --line2:#f5f2ed;
  --ink:#1c1a18; --ink2:#78716a; --ink3:#b0a89f;
  --accent:#d97757; --ok:#3a9e6b; --wa:#d99a2b; --bd:#d9534a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans","Microsoft YaHei",sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden}

.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 8px) 22px calc(env(safe-area-inset-bottom) + 24px);
  opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}
.view.on{opacity:1;pointer-events:auto;transform:none}

#v-home{justify-content:center;align-items:center;text-align:center}
.hero{display:flex;flex-direction:column;align-items:center;margin-bottom:6px}
.hero-word{
  font-family:"Times New Roman",Georgia,"Songti SC",serif;
  font-size:64px;font-weight:600;letter-spacing:-2px;line-height:1;
  color:var(--ink);opacity:0;transform:translateY(14px) scale(.96);
  animation:heroIn .85s cubic-bezier(.2,.9,.25,1) .05s forwards;
}
.hero-line{
  width:0;height:2px;background:var(--accent);border-radius:2px;margin:16px 0 14px;
  animation:lineIn .7s cubic-bezier(.2,.9,.25,1) .5s forwards;
}
@keyframes heroIn{to{opacity:1;transform:none}}
@keyframes lineIn{to{width:52px}}
.home-title{
  font-size:15px;font-weight:600;letter-spacing:.16em;color:var(--ink2);
  opacity:0;animation:fadeUp .6s ease .65s forwards;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.home-meta{font-size:12.5px;color:var(--ink3);margin-top:8px;opacity:0;animation:fadeUp .6s ease .75s forwards}
.gear{position:absolute;top:34px;right:4px;width:40px;height:40px;z-index:5;
  border:none;background:transparent;color:var(--ink3);font-size:17px}
.ksheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
  border-radius:22px 22px 0 0;padding:8px 22px calc(env(safe-area-inset-bottom) + 26px);
  transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.9,.25,1);
  max-width:520px;margin:0 auto}
.ksheet.on{transform:none}
.ksheet h3{font-size:17px;font-weight:700;margin-bottom:6px}
.ksheet p{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-bottom:12px}
.ksheet input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
  font-size:14px;background:#faf8f5;color:var(--ink);outline:none}
.ksheet .row{display:flex;gap:10px;margin-top:14px}
.ksheet button{flex:1;padding:13px;border-radius:12px;border:none;font-size:14.5px;font-weight:600}
.ksheet .ok{background:var(--accent);color:#fff}
.ksheet .no{background:#f7f4f0;color:var(--ink2)}
.lang-row{margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)}
.lang-label{font-size:11.5px;letter-spacing:.08em;color:var(--ink3);display:block;margin-bottom:9px}
.lang-opts{display:flex;gap:8px}
.lang-opts button{flex:1;min-width:0;padding:9px 4px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang-opts button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.start{margin-top:44px;width:100%;max-width:280px;padding:17px;border:none;border-radius:99px;
  background:var(--accent);color:#fff;font-size:16px;font-weight:600;letter-spacing:.5px;
  box-shadow:0 10px 26px rgba(217,119,87,.28);
  opacity:0;
  transition:transform .18s cubic-bezier(.2,.9,.25,1),box-shadow .25s,background .2s;
  animation:fadeUp .6s ease .85s forwards}
.start:active{transform:scale(.96);box-shadow:0 4px 12px rgba(217,119,87,.22)}
.start.press{transform:scale(.94);background:#cd6a4c;box-shadow:0 3px 10px rgba(217,119,87,.2)}
.home-foot{opacity:0;animation:fadeUp .6s ease 1s forwards}
/* 尊重系统的"减少动态效果"设置，同时让截图与低性能设备直接显示 */
@media (prefers-reduced-motion: reduce){
  .hero-word,.home-title,.home-meta,.start,.home-foot{opacity:1!important;transform:none!important;animation:none!important}
  .hero-line{animation:none!important;width:52px!important}
  .view{transition:none!important}
  .row.new{animation:none!important}
}

.home-foot{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);left:0;right:0;text-align:center;
  font-size:11px;color:var(--ink3);line-height:1.7}

#v-scan{padding-top:calc(env(safe-area-inset-top) + 18px)}
/* 标题与进度条吸顶，滚动时始终可见 */
#v-scan .scan-top{position:sticky;top:0;z-index:3;background:var(--bg);
  padding-top:6px;margin-top:-6px}
#v-scan .bar{position:sticky;top:38px;z-index:3;background:var(--bg);padding:6px 0 8px;margin-bottom:12px}
.scan-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.scan-top h2{font-size:20px;font-weight:700}
.scan-top b{font-size:13px;color:var(--ink2);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line2);border-radius:99px;overflow:hidden;margin-bottom:20px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.rows{flex:1}

.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.row .st{width:20px;height:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.ring-s{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tick{font-size:14px;line-height:1}
.row .nm{flex:1;font-size:14.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .vl{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.row .vl b{font-size:14px;font-weight:600}
.row.new{animation:rowIn .34s cubic-bezier(.25,.9,.3,1)}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.c-ok{color:var(--ok)} .c-wa{color:var(--wa)} .c-bd{color:var(--bd)}

#v-result{padding-top:calc(env(safe-area-inset-top) + 8px)}
#v-result .vwrap{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
.dial{position:relative;width:196px;height:196px;flex:0 0 auto}
.dial svg{transform:rotate(-90deg)}
.dial .bgc{fill:none;stroke:var(--line2);stroke-width:8}
.dial .fgc{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;
  transition:stroke-dashoffset 1s cubic-bezier(.22,.9,.25,1),stroke .5s}
.dial .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .big{font-size:44px;font-weight:700;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.dial .big i{font-style:normal;font-size:15px;font-weight:500;color:var(--ink3)}
.dial .lab{font-size:11.5px;color:var(--ink3);margin-top:7px;letter-spacing:.08em}
.verdict{margin-top:26px;font-size:21px;font-weight:700}
.verdict-sub{font-size:13px;color:var(--ink2);margin-top:9px;line-height:1.75;max-width:310px}
.veto{margin-top:18px;width:100%;background:#fdeeec;border:1px solid #f6d2cd;border-radius:14px;
  padding:12px 14px;text-align:left}
.veto .vt{font-size:11.5px;color:#96332c;letter-spacing:.06em;margin-bottom:6px;font-weight:600}
.veto div.vl{font-size:12.5px;color:#7d2a24;line-height:1.65;padding:3px 0;display:flex;gap:6px}
.veto div.vl::before{content:"✕";font-weight:700}
.scorecard{margin-top:26px;width:100%}
.sct{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;transition:transform .15s}
.sct:active{transform:scale(.99)}
.sct .l{font-size:14.5px;font-weight:600}
.sct .r{font-size:13px;color:var(--ink3)}
.again{margin-top:14px;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;
  background:transparent;color:var(--ink2);font-size:14px}

#v-detail{padding-top:calc(env(safe-area-inset-top) + 12px)}
.nav{display:flex;align-items:center;gap:10px;padding:6px 0 18px}
.nav button{border:none;background:none;font-size:15px;color:var(--ink2);padding:4px 8px 4px 0}
.nav h2{font-size:18px;font-weight:700}
.grp{margin-bottom:22px}
.grp-t{display:flex;align-items:center;justify-content:space-between;margin:0 4px 8px;font-size:12px;color:var(--ink3)}
.grp-t b{font-weight:600;color:var(--ink2)}
.itm{display:flex;align-items:center;gap:12px;padding:15px 16px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;margin-bottom:8px;transition:transform .14s}
.itm:active{transform:scale(.985)}
.itm .nm{flex:1;font-size:14.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itm .sc{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.itm .ar{color:var(--ink3);font-size:15px}
.badge{font-size:10px;padding:1px 6px;border-radius:6px;background:#fdeeec;color:#96332c;margin-left:6px;font-weight:600}

#mask{position:fixed;inset:0;background:rgba(28,26,24,.32);opacity:0;pointer-events:none;transition:opacity .28s;z-index:40}
#mask.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:22px 22px 0 0;padding:8px 22px calc(env(safe-area-inset-bottom) + 26px);
  transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.9,.25,1);
  max-width:520px;margin:0 auto;max-height:82vh;overflow-y:auto}
#sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 18px}
.sh-head h3{font-size:19px;font-weight:700}
.sh-score{margin-top:6px;font-size:13px;color:var(--ink2)}
.sh-row{margin-top:18px;padding-top:16px;border-top:1px solid var(--line2)}
.sh-k{font-size:11.5px;letter-spacing:.1em;color:var(--ink3);margin-bottom:7px}
.sh-v{font-size:14px;color:var(--ink);line-height:1.75}
.sh-v.fix{color:#7a5236}
.sh-close{margin-top:22px;width:100%;padding:14px;border-radius:13px;border:none;background:#f7f4f0;
  color:var(--ink2);font-size:14.5px}
.foot-note{font-size:11px;color:var(--ink3);text-align:center;line-height:1.7;padding:14px 0 4px}

</style>
</head>
<body>
<div id="app">

  <section class="view on" id="v-home">
    <div class="hero">
      <div class="hero-word">Claude</div>
      <div class="hero-line"></div>
      <div class="home-title" id="tTitle">环境检测工具</div>
    </div>
    <div class="home-meta" id="homeMeta"></div>
    <button class="start" id="btnStart">开始检测</button>
    <button class="gear" id="btnKey" aria-label="设置">⚙</button>
    <div class="home-foot" id="tPrivacy">仅本机计算，不上传任何数据</div>
  </section>

  <section class="view" id="v-scan">
    <div class="scan-top"><h2 id="tScanning">正在检测</h2><b id="scanCount">0 / 19</b></div>
    <div class="bar"><i id="scanBar"></i></div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="view" id="v-result">
   <div class="vwrap">
    <div class="dial">
      <svg width="196" height="196" viewBox="0 0 196 196">
        <circle class="bgc" cx="98" cy="98" r="88"/>
        <circle class="fgc" id="fg" cx="98" cy="98" r="88" stroke-dasharray="552.9" stroke-dashoffset="552.9"/>
      </svg>
      <div class="mid">
        <div class="big" id="totalNum">0<i>/190</i></div>
        <div class="lab" id="tScore">综合得分</div>
      </div>
    </div>
    <div class="verdict" id="verdict">--</div>
    <div class="verdict-sub" id="verdictSub"></div>
    <div id="vetoBox"></div>
    <div class="scorecard">
      <div class="sct" id="openDetail">
        <span class="l" id="tDetail">查看各项明细</span>
        <span class="r"><span id="lowCount">0 项待改进</span> ›</span>
      </div>
    </div>
    <button class="again" id="btnAgain">重新检测</button>
    <div class="foot-note" id="tDisclaimer">检测结果仅供参考，不代表 Anthropic 官方判断</div>
   </div>
  </section>

  <section class="view" id="v-detail">
    <div class="nav"><button id="back">‹</button><h2 id="tDetailTitle">检测明细</h2></div>
    <div id="groups"></div>
    <div class="foot-note" id="tPick">点击任一项查看原因与处理办法</div>
  </section>

</div>

<div id="ksheet" class="ksheet">
  <div class="grab"></div>
  <h3 id="kKeyTitle">IP 情报接口设置</h3>
  <p id="kKeyDesc">线路类型判定会向 proxycheck.io 查询一次。</p>
  <input id="keyInput" placeholder="proxycheck API key" autocomplete="off" spellcheck="false">
  <div class="lang-row">
    <span class="lang-label" id="kLangTitle">语言</span>
    <div class="lang-opts" id="langOpts"></div>
  </div>
  <div class="row"><button class="no" id="keyCancel">取消</button><button class="ok" id="keySave">保存</button></div>
</div>
<div id="mask"></div>
<div id="sheet">
  <div class="grab"></div>
  <div class="sh-head"><div><h3 id="shTitle">--</h3><div class="sh-score" id="shScore"></div></div></div>
  <div class="sh-row"><div class="sh-k" id="kGot">测到什么</div><div class="sh-v" id="shValue"></div></div>
  <div class="sh-row"><div class="sh-k" id="kWhy">为什么在意</div><div class="sh-v" id="shWhy"></div></div>
  <div class="sh-row"><div class="sh-k" id="kFix">怎么改</div><div class="sh-v fix" id="shFix"></div></div>
  <button class="sh-close" id="shClose">知道了</button>
</div>

<script>
const $=id=>document.getElementById(id);
window.onerror=function(m,src,l,c,e){ console.log('[JS-ERR] '+m+' @line '+l+' '+(e&&e.stack?e.stack:'')); };
window.addEventListener('unhandledrejection',function(ev){ console.log('[JS-REJ] '+(ev.reason&&ev.reason.message||ev.reason)); });
const CIRC=552.9; // 2πr, r=88

/* ===================== 原生读取 ===================== */
let NATIVE=null, INTEG=null, SIM=null, APPS=null, SYSFONTS=[];
try{
  if(window.Native){
    NATIVE=JSON.parse(window.Native.device()||'{}');
    INTEG=JSON.parse(window.Native.integrity()||'{}');
    SIM=JSON.parse(window.Native.sim()||'{}');
    APPS=JSON.parse(window.Native.apps()||'{}');
    SYSFONTS=JSON.parse(window.Native.fonts()||'[]');
  }
}catch(e){}
/* MCC 国家码 → 国家代码（运营商侧硬数据） */
const MCC_CC={ '460':'CN','461':'CN','454':'HK','455':'MO','466':'TW','310':'US','311':'US','312':'US',
'313':'US','314':'US','315':'US','316':'US','330':'PR','234':'GB','235':'GB','262':'DE','208':'FR',
'214':'ES','222':'IT','240':'SE','242':'NO','244':'FI','238':'DK','204':'NL','206':'BE','228':'CH',
'232':'AT','230':'CZ','260':'PL','272':'IE','268':'PT','202':'GR','216':'HU','226':'RO','284':'BG',
'440':'JP','441':'JP','450':'KR','467':'KP','525':'SG','502':'MY','510':'ID','520':'TH','452':'VN',
'515':'PH','404':'IN','405':'IN','406':'IN','410':'PK','413':'LK','470':'BD','302':'CA','505':'AU',
'530':'NZ','724':'BR','722':'AR','730':'CL','732':'CO','714':'PA','712':'CR','250':'RU','255':'UA',
'257':'BY','259':'MD','286':'TR','425':'IL','420':'SA','424':'AE','431':'AE','602':'EG','603':'DZ',
'604':'MA','621':'NG','639':'KE','655':'ZA','286':'TR','901':'XX' };
/* MCC 是 SIM 卡出厂写入的，属于硬数据；countryIso 是系统层字段，
   无服务或 ROM 异常时可能是脏值（实测见过 MCC=460 却报 us 的情况）。
   因此以 MCC 为准，ISO 只在 MCC 缺失时兜底，并单独记录两者是否矛盾。 */
function mccCountry(s){
  if(!s) return '';
  const mcc=String(s.mcc||'').trim();
  const iso=String(s.country||'').toUpperCase();
  const byMcc=MCC_CC[mcc]||'';
  if(byMcc) return byMcc;        // MCC 优先
  return iso;                     // 没有 MCC 才用 ISO
}
/* ISO 与 MCC 是否冲突（冲突说明系统字段不可信，需要提示） */
function isoConflict(s){
  if(!s) return false;
  const mcc=String(s.mcc||'').trim();
  const iso=String(s.country||'').toUpperCase();
  const byMcc=MCC_CC[mcc]||'';
  return !!(byMcc && iso && byMcc!==iso);
}
const SYSFONT_STR=(SYSFONTS||[]).join(' ').toLowerCase();
const sysHas=n=>SYSFONT_STR.indexOf(String(n).toLowerCase())>=0;
console.log('[NATIVE] device='+JSON.stringify(NATIVE));
console.log('[NATIVE] integrity='+JSON.stringify(INTEG));
console.log('[NATIVE] fonts='+SYSFONTS.length);

/* ===================== 官方地区名单 ===================== */
const UNSUP=new Set(['CN','HK','MO','RU','BY','IR','KP','CU','SY']);

/* ===================== IP 情报 ===================== */

/* ===================== 国际化 ===================== */
const LANGS = ['zh-CN','zh-TW','en','ja'];
const LANG_NAME = {'zh-CN':'简体中文','zh-TW':'繁體中文','en':'English','ja':'日本語'};

/* 当前语言：URL 参数 ?lang=xx 优先，其次系统语言 */
function detectLang(){
  try{
    const q=new URLSearchParams(location.search).get('lang');
    if(q&&LANGS.includes(q)) return q;
    const saved=localStorage.getItem('lang');
    if(saved&&LANGS.includes(saved)) return saved;
    const nav=(navigator.languages&&navigator.languages[0])||navigator.language||'';
    if(/^zh-tW|^zh-hk|^zh-hant/i.test(nav)) return 'zh-TW';
    if(/^zh/i.test(nav)) return 'zh-CN';
    if(/^ja/i.test(nav)) return 'ja';
    return 'en';
  }catch(e){ return 'zh-CN'; }
}
let LANG = detectLang();
console.log('[LANG] nav='+((navigator.languages||[]).join(','))+' | '+navigator.language+' → '+LANG);

const I18N = {
'zh-CN':{
  appName:'Claude 环境检测工具',
  homeSub:'检查这台手机是否适合使用 Claude',
  homeMeta:(n,m)=>`共 ${n} 项信号 · 按权重计分（总分 ${m}）`,
  start:'开始检测',
  privacy:'仅本机计算，不上传任何数据',
  scanning:'正在检测',
  score:'综合得分',
  detail:'查看各项明细',
  detailTitle:'检测明细',
  again:'重新检测',
  disclaimer:'检测结果仅供参考，不代表 Anthropic 官方判断',
  pick:'点击任一项查看原因与处理办法',
  verdictTitle:'检测结论',
  vetoTitle:'硬性不过关',
  grp:{fingerprint:'指纹一致性',device:'设备完整性',network:'网络出口'},
  badgeVeto:'否决',
  k:{got:'测到什么',why:'为什么在意',fix:'怎么改'},
  ok:'知道了',
  keyTitle:'IP 情报接口设置',
  keyDesc:'线路类型判定会向 proxycheck.io 查询一次。不带 key 时每个出口 IP 每天 100 次（按你的网络出口 IP 计算，不与其他用户共享）；填入免费 key 后为 1000 次/天。留空则自动降级为只有 ip-api + 本地规则判定。',
  keyPlaceholder:'粘贴 proxycheck API key（可留空）',
  cancel:'取消', save:'保存',
  langTitle:'语言',
  pending:(n)=>`${n} 项待改进`, allPass:'全部达标',
  scScoreLbl:'得分', scWeightLbl:'权重',
  homeTitle:'环境检测工具',
  v:{ok:'可以放心使用',warn:'有一定风险',bad:'不建议使用',stop:'请不要使用'},
  d:{
    veto:(n)=>`有 ${n} 项是硬性不过关。不是扣几分的事：只要踩中一条，注册和使用都会被判成不支持地区，充了钱也白搭。`,
    ok:'各项都对得上，没发现明显矛盾。保持现在这个网络和设备状态，别来回切节点。',
    warn:'有几处看得出问题。单独一项一般不致命，但这些信号是累加的，攒多了信任分就下来了。按明细改完再测一次。',
    bad:'问题比较多，整体不太像一个普通用户的正常环境。先照着明细改，再考虑登录。'
  },
  items:{
    '系统时区':{n:'系统时区',why:'时区会暴露你在哪个时区。网络可以绕到美国，手机时间还停在北京，两边一对就露馅了。它单独出现不算大事，但和其他线索叠在一起，就成了人在国内的旁证。',fix:'设置 → 系统 → 日期和时间，关掉自动，手动选到跟出口一致的城市。改完重开本软件。'},
    '时区偏移':{n:'时区偏移',why:'除了时区名字，系统还会单独报一个 UTC 偏移。有人改了名字、偏移没跟上，这种半改的状态比不改更容易被注意到。',fix:'改完时区重开本软件，看这里有没有跟着变。没变就是设置没生效。'},
    '系统语言':{n:'系统语言',why:'语言列表排第一的那个，等于告诉别人你平时用什么语言。所有应用都能读到，是画像里比较显眼的一条。',fix:'设置 → 系统 → 语言，把 English 调到第一位。中文留在后面不影响用。'},
    '中文语言变体':{n:'中文语言变体',why:'列表里只要还留着简体或繁体，就会被单独记一笔。英文排第一、中文还在，等于自己承认两边都用。',fix:'只留英文，中文删掉。'},
    '系统区域设置':{n:'系统区域设置',why:'界面语言和区域格式是两个开关。有人把界面改成英文，区域还是中国，日期、数字都按国内习惯显示。这种表面英文反而比纯中文更扎眼。',fix:'设置 → 系统 → 语言和区域，区域也要改成对应国家，别只改语言。'},
    '中文字体栈':{n:'中文字体栈',why:'字体是装在系统里的文件，改语言改不动它。所以这一项看的是手机本身有没有中文字体，属于改不掉的证据。',fix:'本机改不了。要换只能换设备。'},
    '厂商预装字体':{n:'厂商预装字体',why:'小米、华为、OPPO 会自带自家字体，只在国产行货上出现。看到这些字体，基本就知道手机是从哪来的。',fix:'部分机型能卸载，不能卸的只能靠隔离方案。'},
    'SIM 与号码':{n:'SIM 与号码',why:'手机能读到 SIM 卡上的国家码，插的哪国卡一目了然，双卡的话两张都读得到。Claude 注册要的实体号码，和这个信息是对得上的。',fix:'尽量用支持地区的实体卡。号码有没有被别人用过，只有运营商知道，本机查不到。'},
    '设备型号':{n:'设备型号',why:'型号来自系统属性，直接报出品牌和机型。单独看意义不大，主要是配合字体、语言一起判断。',fix:'换不了，也不用换。这项最多影响 1 分。'},
    'Root / 框架':{n:'Root / 框架',why:'Root 过的机器，设备信息可以随便改，风险系统对这类环境默认不信任。同一台机器上的几个账号也容易被串起来。',fix:'没特别需要就别 Root。'},
    '模拟器检测':{n:'模拟器检测',why:'云手机和模拟器是批量注册最常用的工具，特征都写在系统属性里，一查就出来。沾上基本没救。',fix:'用真机，别在云手机或模拟器上登录。'},
    '系统 ROM 状态':{n:'系统 ROM 状态',why:'看系统是不是官方原版。刷过第三方 ROM 的机器跟普通用户不太一样，会和其他异常一起算。',fix:'用官方固件就行。'},
    '支付环境':{n:'支付环境',why:'卡号和账单地址在服务器那边，手机上看不到。但能看出你用的是哪套体系：应用从哪个商店装的、有没有 Google 服务、装了什么支付工具。这几样凑起来，大致能判断你的支付在国内还是国外。',fix:'尽量走 Google Play 装应用，付款用跟出口地区一致的卡。'},
    '多开与分身':{n:'多开与分身',why:'一台手机开几个分身，等于同一台设备上挂多个账号。设备信息是共用的，一个出事其他都跑不掉。',fix:'一个设备只留一个账号环境，分身软件卸掉。'},
    '代理隧道状态':{n:'代理隧道状态',why:'只是看现在有没有开全局代理。没开的话，下面的 IP 就是你家的真实地址。',fix:'用代理就开全局模式，别只代理单个应用。'},
    'IP 归属地':{n:'IP 归属地',why:'官方写得很清楚，只有人在支持地区才能注册和使用。名单里没有中国大陆、港澳、俄罗斯这些地方。这一项不过，别的都白搭。',fix:'换一个支持地区的固定出口，家宽比机房稳妥。别用共享节点，同一个 IP 上可能挂着一堆已经被封的号。'},
    'IP 类型与纯净度':{n:'IP 类型与纯净度',why:'机房 IP 和家用宽带待遇完全不同。机房 IP 常被拿去批量注册，整段都容易被拉黑。更麻烦的是，很多卖“家宽”的其实是机房换了名字。所以这里同时问三个地方：有没有被标成机房、ASN 归谁、反向解析指向哪。三条里两条对得上，就按机房算。',fix:'用真家宽或移动网络。只能用机房 IP 的话，至少找独立 IP，别跟人共用。'},
    'IPv6 泄露':{n:'IPv6 泄露',why:'大部分代理只管 IPv4。访问支持 IPv6 的网站时，请求会从本地 IPv6 直接溜出去，把真实运营商暴露了。很多人“明明挂着代理还是被封”，问题就在这。',fix:'手机网络设置里把 IPv6 关掉，或者用能接管 v6 的全局模式。'},
    '实时通信穿透':{n:'实时通信穿透',why:'实时通话功能为了连线，会去探本机的网络地址，普通代理拦不住。探到的地址和出口不在一个地方，等于直接告诉对方你真实在哪。',fix:'用全局代理，或者在系统里限制实时通信权限。'},
    '时区与 IP 一致性':{n:'时区与 IP 一致性',why:'这两项分开看都没事，放一起就出问题。时区在北京、IP 在东京，一对不上，比单独任何一项都明显。',fix:'让时区跟着出口走，最省事也最有效。'},
    'Claude 服务连通':{n:'Claude 服务连通',why:'连不上说明代理规则漏了 anthropic 的域名。常见的情况是浏览器能用、命令行报 403，因为两边走的不是一个出口。',fix:'检查分流规则，把 anthropic.com、claude.ai、claudeusercontent.com 都放进去。'}
  },

    '系统 ROM 状态':{n:'系統 ROM 狀態',why:'看系統是不是官方原版。刷過第三方 ROM 的機器跟普通使用者不太一樣，會和其他異常一起算。',fix:'用官方韌體就行。'},
    '支付环境':{n:'支付環境',why:'卡號和帳單地址在伺服器那邊，手機上看不到。但能看出你用的是哪套體系：應用從哪個商店裝的、有沒有 Google 服務、裝了什麼支付工具。這幾樣湊起來，大致能判斷你的支付在本地還是國外。',fix:'盡量走 Google Play 裝應用，付款用跟出口地區一致的卡。'},
    '多开与分身':{n:'多開與分身',why:'一台手機開幾個分身，等於同一台裝置上掛多個帳號。裝置資訊是共用的，一個出事其他都跑不掉。',fix:'一個裝置只留一個帳號環境，分身軟體卸掉。'},
    '代理隧道状态':{n:'代理隧道狀態',why:'只是看現在有沒有開全域代理。沒開的話，下面的 IP 就是你家的真實位址。',fix:'用代理就開全域模式，別只代理單一應用。'},
    'IP 归属地':{n:'IP 歸屬地',why:'官方寫得很清楚，只有人在支援地區才能註冊和使用。名單裡沒有中國大陸、港澳、俄羅斯這些地方。這一項不過，別的都白搭。',fix:'換一個支援地區的固定出口，家用寬頻比機房穩妥。別用共享節點，同一個 IP 上可能掛著一堆已經被封的號。'},
    'IP 类型与纯净度':{n:'IP 類型與純淨度',why:'機房 IP 和家用寬頻待遇完全不同。機房 IP 常被拿去批次註冊，整段都容易被列入黑名單。更麻煩的是，很多賣「家用寬頻」的其實是機房換了名字。所以這裡同時問三個地方：有沒有被標成機房、ASN 歸誰、反向解析指向哪。三條裡兩條對得上，就按機房算。',fix:'用真家用寬頻或行動網路。只能用機房 IP 的話，至少找獨立 IP，別跟人共用。'},
    'IPv6 泄露':{n:'IPv6 洩漏',why:'大部分代理只管 IPv4。存取支援 IPv6 的網站時，請求會從本地 IPv6 直接溜出去，把真實電信商暴露了。很多人「明明掛著代理還是被封」，問題就在這。',fix:'手機網路設定裡把 IPv6 關掉，或者用能接管 v6 的全域模式。'},
    '实时通信穿透':{n:'即時通訊穿透',why:'即時通話功能為了連線，會去探本機的網路位址，普通代理攔不住。探到的位址和出口不在一個地方，等於直接告訴對方你真實在哪。',fix:'用全域代理，或者在系統裡限制即時通訊權限。'},
    '时区与 IP 一致性':{n:'時區與 IP 一致性',why:'這兩項分開看都沒事，放一起就出問題。時區在本地、IP 在東京，一對不上，比單獨任何一項都明顯。',fix:'讓時區跟著出口走，最省事也最有效。'},
    'Claude 服务连通':{n:'Claude 服務連通',why:'連不上說明代理規則漏了 anthropic 的網域。常見的情況是瀏覽器能用、命令列報 403，因為兩邊走的不是一個出口。',fix:'檢查分流規則，把 anthropic.com、claude.ai、claudeusercontent.com 都放進去。'}
  },

  keyDesc:'Line-type detection queries proxycheck.io once. Without a key: 100 queries per day, counted per your exit IP (not shared with other users). With a free key: 1,000 per day. Leave empty to fall back to ip-api plus local rules only.',
  keyPlaceholder:'Paste proxycheck API key (optional)',

  d:{
    veto:(n)=>`${n} blocking issue(s). This is not about losing points — any single one of them marks the account as coming from an unsupported region. Signing up or paying will not help.`,
    ok:'Everything lines up. Keep this network and device setup stable, and avoid switching nodes back and forth.',
    warn:'A few things stand out. None is usually fatal alone, but these signals add up and steadily lower trust. Fix the items below, then run again.',
    bad:'Quite a few problems. Overall this does not look like a typical user environment. Work through the list before signing in.'
  },
  items:{
    '系统时区':{n:'System timezone',why:'Your timezone reveals where you are. Traffic can be routed through the US while the clock still says Beijing, and the mismatch gives it away. Alone it is minor, but combined with other clues it becomes evidence of the real location.',fix:'Settings → System → Date & time, turn off automatic, then pick a city that matches your exit. Restart the app afterwards.'},
    '时区偏移':{n:'Timezone offset',why:'Besides the timezone name, the system reports a separate UTC offset. People change the name but the offset lags behind, and a half-changed state draws more attention than leaving it alone.',fix:'After changing the timezone, restart the app and check this value moved. If it did not, the setting did not take effect.'},
    '系统语言':{n:'System language',why:'Whichever language sits first in the list tells apps what you normally use. Every app can read it, which makes it one of the more visible signals.',fix:'Settings → System → Languages, move English to the top. Keeping Chinese further down is fine.'},
    '中文语言变体':{n:'Chinese variant present',why:'As long as a Simplified or Traditional Chinese entry stays in the list, it gets recorded separately. English first but Chinese still present reads as using both.',fix:'Keep only English and remove Chinese from the list.'},
    '系统区域设置':{n:'System locale',why:'Interface language and regional format are two separate switches. Some people switch the interface to English while the region stays China, so dates and numbers still follow local conventions. That surface-level English stands out more than plain Chinese.',fix:'Settings → System → Language & region: change the region too, not just the language.'},
    '中文字体栈':{n:'CJK fonts installed',why:'Fonts are files installed in the system; changing the language does not touch them. This checks whether the phone itself carries Chinese fonts, which is evidence you cannot edit away.',fix:'Not changeable on this device. Only a different device helps.'},
    '厂商预装字体':{n:'Vendor fonts',why:'Xiaomi, Huawei and OPPO ship their own fonts, which only appear on Chinese domestic models. Seeing them basically tells you where the phone came from.',fix:'Some models allow uninstalling them; the rest need an isolation setup.'},
    'SIM 与号码':{n:'SIM and number',why:'The phone can read the country code stored on the SIM, so which country the card belongs to is plain to see, and with dual SIM both are readable. Claude signup requires a real number from a supported region, and this lines up with that.',fix:'Use a physical SIM from a supported region. Whether a number was already used by someone else is only known to the carrier, not readable here.'},
    '设备型号':{n:'Device model',why:'The model comes from system properties and reports brand and model directly. On its own it means little; it mainly works alongside fonts and language.',fix:'Cannot be changed, and does not need to be. This one is worth at most 1 point.'},
    'Root / 框架':{n:'Root / framework',why:'On a rooted device device data can be edited freely, and risk systems distrust that by default. Several accounts on the same rooted machine also become easy to link together.',fix:'Avoid rooting unless you really need it.'},
    '模拟器检测':{n:'Emulator check',why:'Cloud phones and emulators are the most common tool for bulk signups, and their traces sit in system properties where a single read exposes them. Once flagged, recovery is unlikely.',fix:'Use a real phone. Do not sign in from cloud phones or emulators.'},
    '系统 ROM 状态':{n:'System ROM state',why:'Checks whether the system is the official release. Devices running third-party ROMs look different from ordinary users and get counted alongside other anomalies.',fix:'Stick with official firmware.'},
    '支付环境':{n:'Payment environment',why:'Card numbers and billing addresses live on the server side and are not readable here. What is visible is which ecosystem you use: which store installed your apps, whether Google services exist, which payment apps are present. Together these roughly tell whether your payments are domestic or overseas.',fix:'Install apps through Google Play where possible, and pay with a card matching your exit region.'},
    '多开与分身':{n:'Cloned apps / profiles',why:'Running several app clones on one phone means several accounts on one device. Device data is shared, so if one is flagged the rest go with it.',fix:'Keep one account environment per device and uninstall cloning tools.'},
    '代理隧道状态':{n:'Proxy tunnel state',why:'This only reports whether a system-wide proxy is active. If it is not, the IP below is your real home address.',fix:'Use global mode when proxying, not per-app proxying.'},
    'IP 归属地':{n:'IP location',why:'The policy is explicit: only people physically in supported regions may create and use an account. The list excludes mainland China, Hong Kong, Macau and Russia. If this one fails, nothing else matters.',fix:'Use a fixed exit in a supported region; residential is safer than datacenter. Avoid shared nodes — dozens of already-banned accounts may sit on the same IP.'},
    'IP 类型与纯净度':{n:'IP type and cleanliness',why:'Datacenter IPs and home broadband are treated very differently. Datacenter ranges get used for bulk signups and often end up blocklisted wholesale. Worse, many “residential” proxies are datacenter IPs under a new name. So this asks three places at once: whether it is flagged as hosting, who owns the ASN, and where reverse DNS points. Two of three pointing at a datacenter is enough to call it one.',fix:'Use genuine home broadband or mobile data. If only datacenter IPs are available, at least get a dedicated one instead of sharing.'},
    'IPv6 泄露':{n:'IPv6 leak',why:'Most proxies only handle IPv4. When a site supports IPv6, the request slips out through the local IPv6 route and exposes your real carrier. This is the usual reason people get blocked even while running a proxy.',fix:'Turn off IPv6 in the phone network settings, or use a global mode that also captures v6.'},
    '实时通信穿透':{n:'WebRTC leak',why:'Real-time calling probes local network addresses in order to connect, and ordinary proxies cannot stop it. If the address it finds is in a different place than your exit, you have told them where you really are.',fix:'Use a global proxy, or restrict real-time communication permissions in the system.'},
    '时区与 IP 一致性':{n:'Timezone vs IP',why:'Either one alone is fine; together they become a problem. Timezone in Beijing with an IP in Tokyo is a mismatch more obvious than either signal by itself.',fix:'Let the timezone follow your exit. Cheapest and most effective step.'},
    'Claude 服务连通':{n:'Claude reachability',why:'Failing to connect means the proxy rules miss an anthropic domain. The usual symptom is a working browser but a 403 from the command line, because the two use different exits.',fix:'Check your routing rules and include anthropic.com, claude.ai and claudeusercontent.com.'}
  },

/* 原生 HTTP 回调登记表：Java 在子线程取完数据后回调这里 */
const httpWaiters={}; let httpSeq=0;
window.__nativeHttp=function(id, body){
  const cb=httpWaiters[id];
  if(cb){ delete httpWaiters[id]; cb(body||''); }
};
/* 走原生异步通道，避免阻塞渲染线程（同步调用会让点击后卡住好几秒） */
function nativeGet(url){
  return new Promise(resolve=>{
    if(!(window.Native && window.Native.httpGetAsync)) return resolve(null);
    const id='h'+(++httpSeq);
    httpWaiters[id]=resolve;
    try{ window.Native.httpGetAsync(url, id); }
    catch(e){ delete httpWaiters[id]; return resolve(null); }
    setTimeout(()=>{ if(httpWaiters[id]){ delete httpWaiters[id]; resolve(''); } }, 9000);
  });
}
/* 原生优先的 HTTP：原生层不受跨域限制，可用不支持 CORS 的情报接口 */
async function netGet(url){
  const body=await nativeGet(url);
  if(body===null) return fetchJSON(url);   // 网页版没有原生桥，退回 fetch
  console.log('[NET] '+url.slice(8,42)+' len='+(body?body.length:0));
  if(!body) return null;
  try{ return JSON.parse(body); }catch(e){ return null; }
}

    state.isp=a.isp||''; state.org=a.org||''; state.asname=a.asname||'';
    const m=/^AS(\d+)/.exec(a.as||'');
    if(m) state.asn=m[1];
    state.hosting=a.hosting===true;
    state.proxy=a.proxy===true;
    state.mobile=a.mobile===true;
    state.reverse=a.reverse||'';
  }

  // 源 2：ipwho.is 兜底补齐（原生请求偶发返回空，所以只做补充）
  if(!state.ip||!state.cc){
    const g=await netGet('https://ipwho.is/');
    if(g&&g.ip){
      state.ip=g.ip||state.ip;
      state.cc=(g.country_code||state.cc||'').toUpperCase();
      const con=g.connection||{};
      state.isp=state.isp||con.isp||'';
      state.org=state.org||con.org||'';
      if(!state.asn) state.asn=String(con.asn||'');
    }
  }

  // 源 3：proxycheck —— proxy / type(VPN|PUB|RES|Business)
  let pc=null;
  if(state.ip){
    const q='https://proxycheck.io/v2/'+state.ip+'?vpn=1&asn=1'+(PC_KEY?('&key='+encodeURIComponent(PC_KEY)):'');
    const raw=await netGet(q);
    if(raw&&raw.status==='ok'){
      const key=Object.keys(raw).find(k=>k!=='status');
      if(key&&raw[key]&&typeof raw[key]==='object'){
        pc=raw[key]; state.sourceCount++;
        if(!state.reverse && pc.hostname) state.reverse=String(pc.hostname);
      }
    }
  }
  state.intelReady = apiOk || !!pc;

  /* ---------- 证据计票：机房票 vs 住宅票 ---------- */
  const ev=[]; let dc=0, res=0;
  const asnName=((state.asname||'')+' '+(state.org||'')+' '+(state.isp||'')).toLowerCase();
  const ptr=(state.reverse||'').toLowerCase();
  const hostName=/hosting|datacenter|data center|cloud|server|colo|\bvps\b|机房|虚拟/.test(asnName);
  const hostPtr=/vps|server|colo|dedicated|static|cloud|node|m247|vultr|linode|digitalocean|ovh|contabo|hetzner|choopa/.test(ptr);

  if(apiOk&&state.hosting){ dc++; ev.push(R().evDc); }
  if(DC_ASN[state.asn]){ dc++; ev.push(R().evAsn(state.asn,DC_ASN[state.asn])); }
  if(hostName){ dc++; ev.push(R().evAsnName); }
  if(hostPtr){ dc++; ev.push(R().evPtr(state.reverse)); }
  if(apiOk&&state.proxy){ dc++; ev.push(R().evProxy); }
  if(pc&&pc.proxy==='yes'){ dc++; ev.push(R().evPcProxy(pc.type||R().unk)); }

  /* 反向解析归属：真家宽的 PTR 一般挂在运营商自有域名下
     （如 *.ocn.ne.jp / *.bb.teac.ne.jp）；若 PTR 是第三方短域名，
     多半是"住宅代理"服务商把机房/代理节点挂进住宅网段 */
  const ispName=(state.isp+' '+(state.org||'')).toLowerCase();
  const ispKeys=['sony','ocn','ntt','kddi','softbank','comcast','verizon','charter','cox','centurylink',
                 'frontier','virgin','sky','orange','telefonica','swisscom','singtel','starhub',
                 'chinanet','unicom','cmcc','telecom','ntt.com','plala','biglobe','so-net'];
  const ispKeyHit=ispKeys.find(k=>ispName.includes(k));
  const ptrIsIsp=!!(ispKeyHit&&ptr.includes(ispKeyHit));
  const ptrGeneric=/^(ip[-.]?\d|c-?\d|static|dynamic|ppp|dsl|bb|host-?\d|xdsl|pool|rev|node)/.test(ptr)||ptr==='';
  const ptrThirdParty=!!ptr&&!ptrIsIsp&&!ptrGeneric&&/\.[a-z]{2,}$/.test(ptr);
  if(ptrThirdParty){ dc++; ev.push(R().evPtrThird(state.reverse)); }
  if(ptrIsIsp){ res++; ev.push(R().evPtrIsp); }

  if(apiOk&&state.mobile&&!state.hosting){ res+=2; ev.push(R().evMobile); }
  if(apiOk&&!state.hosting&&!state.proxy){ res++; }
  if(pc&&pc.proxy==='no'){ res++; }
  if(pc&&/residential/i.test(pc.type||'')){ res+=2; ev.push(R().evPcRes); }

  state.dcVotes=dc; state.resVotes=res; state.evidence=ev;
  state.dcByAsn=!!DC_ASN[state.asn];
  state.fakeHome = dc>0 && /telecom|unicom|broadband|fiber|cable|comcast|verizon/.test(asnName);
  console.log('[INTEL] ip='+state.ip+' apiOk='+apiOk+' pcOk='+(!!pc)+' dcVotes='+dc+' resVotes='+res+' ev='+JSON.stringify(ev));
 }catch(err){
  console.log('[INTEL-ERR] '+err+' | native='+(!!(window.Native&&window.Native.httpGet)));
 }
}

function webrtcProbe(){
  return new Promise(res=>{
    const found=new Set();let done=false;
    const fin=()=>{if(!done){done=true;res([...found]);}};
    setTimeout(fin,3800);
    try{
      const pc=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun.cloudflare.com:3478']}]});
      pc.createDataChannel('x');
      pc.onicecandidate=e=>{
        if(!e.candidate)return fin();
        const c=e.candidate.candidate;
        const m=/candidate:\S+ \d+ \S+ \d+ ([^\s]+) \d+ typ (\w+)/.exec(c);
        if(m) found.add(m[1]+'|'+m[2]);
      };
      pc.createOffer().then(o=>pc.setLocalDescription(o));
    }catch(e){fin();}
  });
}

    results.forEach(r=>{
      const t=itemText(r.key);
      r.nm=t.n; r.why=t.why; r.fix=t.fix;
      if(r.recalc){ try{ const v=r.recalc(); r.v=v; }catch(e){} }
    });
    if($('v-detail').classList.contains('on')) buildDetail();
    if($('v-result').classList.contains('on')) showResult();
  }
}

/* ===================== 视图 ===================== */
function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));
  const el=document.getElementById(id);
  if(el) el.scrollTop=0;
}
$('homeMeta').textContent=L().homeMeta(TOTAL,MAX);

/* ===================== 扫描 ===================== */
let doneCount=0,totalScore=0;

async function scan(){
  results.length=0;doneCount=0;totalScore=0;
  $('rows').innerHTML='';
  $('scanCount').textContent='0 / '+TOTAL;
  $('scanBar').style.width='0%';
  $('vetoBox').innerHTML='';

  // 先把空页面画出来，视觉上零延迟
  show('v-scan');
  await nextFrame();

  const rowsEl=$('rows');

  // 预先把所有行骨架铺好，动画从头就顺
  const rowRefs=[];
  try{
  CHECKS.forEach(c=>{
    const t=itemText(c.key);
    const row=document.createElement('div');
    row.className='row';
    row.innerHTML='<span class="st"><span class="ring-s"></span></span>'+
                  '<span class="nm">'+esc(t.n)+'</span><span class="vl">'+esc(L().scanning)+'</span>';
    rowsEl.appendChild(row);
    rowRefs.push(row);
  });
  }catch(err){ console.log('[SKEL-ERR] '+err); }
  console.log('[SKEL] rows='+rowRefs.length+' lang='+LANG);

  // 网络预取放在骨架绘制之后，避免阻塞首帧
  intelPromise=loadIPIntel();
  await nextFrame();

  for(let i=0;i<CHECKS.length;i++){
    const c=CHECKS[i];
    const t=itemText(c.key);
    const row=rowRefs[i];
    row.classList.add('new');
    // 逐行显现：让整页有节奏地铺开，而不是一瞬间全亮
    row.style.animationDelay='0ms';
    // 只在当前行即将离开视口时才滚动，避免一上来就滚到底
    const sv=$('v-scan');
    const rb=row.getBoundingClientRect(), sb=sv.getBoundingClientRect();
    if(rb.bottom > sb.bottom - 8){
      sv.scrollTop += Math.min(rb.bottom - sb.bottom + 24, 90);
    }

    const t0=Date.now();
    let r;
    try{ r=await c.fn(); }catch(e){ console.log('[CK-ERR] '+c.nm+' :: '+e); r={p:5,v:R().err}; }
    const wait=Math.max(0,300-(Date.now()-t0));
    if(wait) await sleep(wait);

    const lv=lvOf(r.p);
    row.querySelector('.st').innerHTML='<span class="tick '+CLS[lv]+'">'+(lv==='ok'?'✓':lv==='wa'?'!':'✕')+'</span>';
    const w=c.w||10, got=earnedOf(w,r.p);
    row.querySelector('.vl').innerHTML='<b class="'+CLS[lv]+'">'+fmtNum(got)+'</b><span style="color:var(--ink3);font-size:11px">/'+w+'</span>';

    console.log('[CK] '+t.n+' | '+r.p+'/10 → '+fmtNum(got)+'/'+w+' | '+r.v);
    results.push({cat:c.cat,key:c.key,nm:t.n,p:r.p,w:w,got:got,v:r.v,why:t.why,fix:t.fix,
                  veto:r.veto||null,recalc:r.recalc||null});

    doneCount++;totalScore+=got;
    $('scanCount').textContent=doneCount+' / '+TOTAL;
    $('scanBar').style.width=(doneCount/TOTAL*100)+'%';
    await sleep(90);
  }
  await sleep(300);
  showResult();
}

/* ===================== 结论 ===================== */
function showResult(){
  const vetos=results.filter(r=>r.veto);
  const pct=Math.round(totalScore/MAX*100);   // MAX=100，pct 即得分

  let title,desc,color;
  if(vetos.length){
    title=L().v.stop;
    desc=L().d.veto(vetos.length);
    color='var(--bd)';
  }else if(pct>=85){
    title=L().v.ok;
    desc=L().d.ok;
    color='var(--ok)';
  }else if(pct>=65){
    title=L().v.warn;
    desc=L().d.warn;
    color='var(--wa)';
  }else{
    title=L().v.bad;
    desc=L().d.bad;
    color='var(--bd)';
  }

  show('v-result');

  const fg=$('fg');
  fg.style.stroke=color;
  requestAnimationFrame(()=>{ fg.style.strokeDashoffset=String(CIRC*(1-totalScore/MAX)); });

  const el=$('totalNum');
  let n=0;const step=Math.max(0.5,Math.round(totalScore/28*10)/10);
  const timer=setInterval(()=>{
    n=Math.min(totalScore,n+step);
    el.innerHTML=fmtNum(n)+'<i>/'+MAX+'</i>';
    if(n>=totalScore) clearInterval(timer);
  },26);

  $('verdict').textContent=title;
  $('verdict').style.color=color;
  $('verdictSub').textContent=desc;

  if(vetos.length){
    $('vetoBox').innerHTML='<div class="veto"><div class="vt">'+esc(L().vetoTitle)+'</div>'+
      vetos.map(v=>'<div class="vl">'+v.veto+'</div>').join('')+'</div>';
  }

  // 只有权重≥3 且得分率<80% 才算待改进；权重 1-2 的项单列，不计入
  const low=results.filter(r=>r.p<8 && (r.w||10)>=3).length;
  $('lowCount').textContent=low?L().pending(low):L().allPass;
  buildDetail();
}

/* ===================== 明细 ===================== */
const GROUP_KEY={fp:'fingerprint',dev:'device',net:'network'};
function buildDetail(){
  const g=$('groups');g.innerHTML='';
  const cats=[...new Set(results.map(r=>r.cat))];
  cats.forEach(cat=>{
    const items=results.filter(r=>r.cat===cat).slice().sort((a,b)=>(b.w||10)-(a.w||10));
    const sum=items.reduce((a,b)=>a+ (b.got!=null?b.got:b.p),0);
    const max=items.reduce((a,b)=>a+(b.w||10),0);
    const wrap=document.createElement('div');wrap.className='grp';
    const gk=GROUP_KEY[cat]||cat;
    wrap.innerHTML='<div class="grp-t"><span>'+esc(L().grp[gk]||gk)+'</span><b>'+fmtNum(sum)+' / '+max+'</b></div>';
    items.forEach(it=>{
      const lv=lvOf(it.p);
      const d=document.createElement('div');d.className='itm';
      d.innerHTML='<span class="nm">'+esc(it.nm)+(it.veto?'<span class="badge">'+esc(L().badgeVeto)+'</span>':'')+'</span>'+
        '<span class="sc '+CLS[lv]+'">'+fmtNum(it.got!=null?it.got:it.p)+'<span style="color:var(--ink3);font-weight:400;font-size:11.5px">/'+(it.w||10)+'</span></span>'+
        '<span class="ar">›</span>';
      d.onclick=()=>openSheet(it);
      wrap.appendChild(d);
    });
    g.appendChild(wrap);
  });
}
function openSheet(it){
  const lv=lvOf(it.p);
  $('shTitle').textContent=it.nm;
  const col=lv==='ok'?'var(--ok)':lv==='wa'?'var(--wa)':'var(--bd)';
  const w=it.w||10;
  $('shScore').innerHTML=esc(L().scScoreLbl)+' <b style="color:'+col+'">'+fmtNum(it.got!=null?it.got:it.p)+'</b> / '+w
    +'　<span style="color:var(--ink3)">'+esc(L().scWeightLbl)+' '+w+'</span>'+(it.veto?'　<span class="badge">'+esc(L().badgeVeto)+'</span>':'');
  $('shValue').textContent=it.v;
  $('shWhy').textContent=it.why;
  $('shFix').textContent=it.fix;
  $('mask').classList.add('on');
  $('sheet').classList.add('on');
}
function closeSheet(){
  $('mask').classList.remove('on');
  $('sheet').classList.remove('on');
  const k=$('ksheet'); if(k) k.classList.remove('on');
}

/* ===================== 返回键 ===================== */
window.appBack=function(){
  if($('sheet').classList.contains('on')){closeSheet();return true;}
  if($('v-detail').classList.contains('on')){show('v-result');return true;}
  if($('v-result').classList.contains('on')){show('v-home');return true;}
  if($('v-scan').classList.contains('on')){return true;}
  return false;
};

/* 启动即按系统语言渲染 */
applyLang();

/* ===================== 事件 ===================== */
function startWithFeedback(btn){
  if(btn.dataset.busy) return;
  btn.dataset.busy='1';
  btn.classList.add('press');
  setTimeout(()=>{
    btn.classList.remove('press');
    scan().finally(()=>{ delete btn.dataset.busy; });
  },140);
}
$('btnStart').onclick=()=>startWithFeedback($('btnStart'));
$('btnAgain').onclick=()=>startWithFeedback($('btnAgain'));
$('openDetail').onclick=()=>{buildDetail();show('v-detail');};
$('back').onclick=()=>show('v-result');
$('mask').onclick=closeSheet;

/* 设置弹层 */
$('btnKey').onclick=()=>{
  $('keyInput').value=PC_KEY||'';
  $('ksheet').classList.add('on');
  $('mask').classList.add('on');
};
$('keyCancel').onclick=()=>{
  $('ksheet').classList.remove('on');
  $('mask').classList.remove('on');
};
$('keySave').onclick=()=>{
  PC_KEY=($('keyInput').value||'').trim();
  try{ if(PC_KEY) localStorage.setItem('pcKey',PC_KEY); else localStorage.removeItem('pcKey'); }catch(e){}
  $('ksheet').classList.remove('on');
  $('mask').classList.remove('on');
};
$('shClose').onclick=closeSheet;
</script>
